<!DOCTYPE html>
<html>
    <head>
        <title>HEADER FOOTER & FORMS</title>
     </head>   

     <body>
        
        <!--the action attribute below sends data entered in the form to a specific location-->
        <!--for sensitive data use attribute method="POST" -->
        <form action="index.php" method="POST">
           
            <!--The required attribute tells us to fill in that section otherwise it wont submit -->
            <label for="username">Username: </label>
            <input type="text" id="username" placeholder="Abarai Renji" required><br>

            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="xyz@gmail.com" required><br>

            <label for="password">Password: </label>
            <input type="password" id="password" minlength="6" maxlength="100" required><br>
            
            <label for="phone">Phone Number: </label>
            <input type="tel" id="phone" required><br>
             
            <label for="bday">Date of Birth:</label>
            <input type="date" id="bday" required><br>
            

            <input type="submit"><br>
            <input type="reset">

            <header></header>

            <footer></footer>

        </form>


        </body>
</html>
